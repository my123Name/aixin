<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>爱心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            /* 关键：canvas 样式宽高 = 视口宽高，保证填满且居中 */
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: transparent;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');

            // ----- 设备像素比 -----
            const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

            // ----- 尺寸管理：使用视口宽高，canvas物理像素 = 视口像素 * DPR -----
            let W = 0, H = 0;          // 逻辑尺寸 (CSS像素)
            let CW = 0, CH = 0;        // 物理尺寸 (canvas 实际像素)
            let CX = 0, CY = 0;        // 中心坐标 (逻辑像素)

            function resizeCanvas() {
                // 获取视口宽高 (逻辑像素)
                W = window.innerWidth;
                H = window.innerHeight;

                // Canvas 物理像素 = 逻辑像素 * DPR
                CW = W * DPR;
                CH = H * DPR;
                canvas.width = CW;
                canvas.height = CH;

                // Canvas CSS 尺寸 = 视口尺寸 (100vw, 100vh)
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';

                // 中心坐标基于逻辑像素
                CX = W / 2;
                CY = H / 2;

                // 缩放因子：以宽度为基准，因为心形是正方形区域，取宽高较小值
                const baseSize = Math.min(W, H);
                // 心形基础缩放：使得心形占屏幕 92% 左右 (与之前逻辑一致)
                window.HEART_SCALE = (baseSize / 780) * 14;
                // 存储逻辑尺寸供其他计算
                window.LOGIC_W = W;
                window.LOGIC_H = H;
            }

            resizeCanvas();

            // 窗口变化重置 (防抖)
            let resizeTimer = null;
            window.addEventListener('resize', () => {
                if (resizeTimer) clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    resizeCanvas();
                    // 重新生成心形 (因为坐标基于新尺寸)
                    heart = new Heart();
                    frameCounter = 0;
                    resizeTimer = null;
                }, 100);
            });

            // ----- 颜色配置 -----
            const HEART_COLOR = '#FF69B4';
            const HEART_COLOR_LIGHT = '#FFB6C1';
            const GENERATE_FRAME = 60;

            // ----- 心形函数 (使用逻辑坐标) -----
            function heartFunction(t) {
                const scale = window.HEART_SCALE || 14;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                return {
                    x: Math.round(x * scale + CX),
                    y: Math.round(y * scale + CY)
                };
            }

            // ----- 随机散射 (内部扩散) -----
            function scatterInside(x, y, beta = 0.15) {
                const ratioX = -beta * Math.log(Math.random());
                const ratioY = -beta * Math.log(Math.random());
                const dx = ratioX * (x - CX);
                const dy = ratioY * (y - CY);
                return { x: Math.round(x - dx), y: Math.round(y - dy) };
            }

            // ----- 呼吸曲线 -----
            function curve(p) {
                return Math.sin(p * 0.25) * 0.5 + 0.5;
            }

            // ----- 位置扰动 (呼吸核心) -----
            function calcPosition(x, y, ratio) {
                const dx = x - CX;
                const dy = y - CY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const force = 1 / Math.pow(dist + 0.1, 0.5);
                const nx = ratio * force * dx * 0.5 + (Math.random() - 0.5) * 1.5;
                const ny = ratio * force * dy * 0.5 + (Math.random() - 0.5) * 1.5;
                return { x: Math.round(x - nx), y: Math.round(y - ny) };
            }

            // ----- 核心类：心形粒子系统 (精巧粒子版) -----
            class Heart {
                constructor() {
                    this._points = [];
                    this._edgeDiffusionPoints = [];
                    this._centerDiffusionPoints = [];
                    this.generateFrame = GENERATE_FRAME;
                    this.build(4000);
                }

                build(number) {
                    const pointSet = new Set();
                    let attempts = 0;
                    while (this._points.length < number && attempts < number * 3) {
                        const t = Math.random() * 2 * Math.PI;
                        const p = heartFunction(t);
                        const key = p.x + ',' + p.y;
                        if (!pointSet.has(key)) {
                            pointSet.add(key);
                            this._points.push(p);
                        }
                        attempts++;
                    }

                    // 边缘扩散点
                    for (const p of this._points) {
                        for (let j = 0; j < 3; j++) {
                            const sp = scatterInside(p.x, p.y, 0.05);
                            this._edgeDiffusionPoints.push(sp);
                        }
                    }

                    // 中心扩散点
                    const pointList = [...this._points];
                    for (let i = 0; i < 6000; i++) {
                        const idx = Math.floor(Math.random() * pointList.length);
                        const chosen = pointList[idx];
                        const sp = scatterInside(chosen.x, chosen.y, 0.17);
                        this._centerDiffusionPoints.push(sp);
                    }
                }

                // 计算当前帧所有粒子 (包含动态大小)
                calc(frame) {
                    const frameRatio = frame / 12 * Math.PI;
                    const ratio = 8 * curve(frameRatio);

                    const allPoints = [];

                    // 粒子大小：使用逻辑像素，范围 0.4~1.2，在手机上由于DPR放大，依然精巧
                    const baseMin = 0.35;
                    const baseMax = 1.1;

                    // 主轮廓点
                    for (const p of this._points) {
                        const np = calcPosition(p.x, p.y, ratio);
                        const size = baseMin + Math.random() * (baseMax - baseMin);
                        allPoints.push({ x: np.x, y: np.y, size: size });
                    }

                    // 边缘扩散点
                    for (const p of this._edgeDiffusionPoints) {
                        const np = calcPosition(p.x, p.y, ratio);
                        const size = baseMin * 0.8 + Math.random() * (baseMax * 0.7 - baseMin * 0.8);
                        allPoints.push({ x: np.x, y: np.y, size: size });
                    }

                    // 中心扩散点
                    for (const p of this._centerDiffusionPoints) {
                        const np = calcPosition(p.x, p.y, ratio);
                        const size = baseMin * 1.1 + Math.random() * (baseMax * 1.1 - baseMin * 1.1);
                        allPoints.push({ x: np.x, y: np.y, size: size });
                    }

                    return allPoints;
                }

                render(ctx, frame) {
                    const points = this.calc(frame % this.generateFrame);

                    // 清空 (透明背景)
                    ctx.clearRect(0, 0, CW, CH);

                    // ---- 绘制粒子 (圆形，抗锯齿) ----
                    for (const p of points) {
                        const color = Math.random() > 0.6 ? HEART_COLOR_LIGHT : HEART_COLOR;
                        ctx.beginPath();
                        // 半径 = size * 0.5，至少0.3逻辑像素
                        const radius = Math.max(0.3, p.size * 0.5);
                        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.globalAlpha = 0.85 + Math.random() * 0.15;
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1.0;

                    // ---- 文字装饰 (基于逻辑尺寸) ----
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    const baseFontSize = Math.min(W, H) / 16;
                    const fontSize = Math.min(baseFontSize, 40);
                    ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", Arial, sans-serif`;
                    ctx.fillStyle = '#FF69B4';
                    ctx.shadowColor = 'rgba(255,105,180,0.25)';
                    ctx.shadowBlur = 18;
                    ctx.fillText('💗 哥哥，喜欢吗 💗', CX, CY - Math.min(W, H) * 0.35);

                    const subFontSize = Math.min(Math.min(W, H) / 28, 22);
                    ctx.font = `italic ${subFontSize}px Arial, sans-serif`;
                    ctx.fillStyle = '#FFB6C1';
                    ctx.shadowBlur = 10;
                    ctx.fillText('✨ You are my heartbeat ✨', CX, CY - Math.min(W, H) * 0.27);

                    ctx.shadowBlur = 0;
                }
            }

            // ----- 实例化心形 -----
            let heart = new Heart();
            let frameCounter = 0;
            let lastTimestamp = 0;

            // ----- 动画循环 (限制帧率 30fps) -----
            function animate(timestamp) {
                if (timestamp - lastTimestamp < 33) {
                    requestAnimationFrame(animate);
                    return;
                }
                lastTimestamp = timestamp;

                heart.render(ctx, frameCounter);
                frameCounter = (frameCounter + 1) % GENERATE_FRAME;

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            // ----- 键盘快捷键 -----
            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    frameCounter = 0;
                }
                if (e.key === 'f' || e.key === 'F') {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else {
                        document.exitFullscreen().catch(() => {});
                    }
                }
            });

            // 点击/触摸重置呼吸相位
            canvas.addEventListener('click', () => {
                frameCounter = 0;
            });
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                frameCounter = 0;
            }, { passive: false });

            console.log('✨ 呼吸爱心 · 完美居中版 (DPR=' + DPR + ', 逻辑尺寸=' + W + 'x' + H + ')');
        })();
    </script>
</body>
</html>
