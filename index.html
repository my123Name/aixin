<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>爱心 · 自适应放大</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: transparent;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');

            // ----- 设备像素比 (限制最大2.5以平衡性能) -----
            const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

            // ----- 尺寸变量 -----
            let W = 0, H = 0;          // 逻辑尺寸 (CSS像素)
            let CW = 0, CH = 0;        // 物理尺寸 (canvas 实际像素)
            let CX = 0, CY = 0;        // 中心坐标 (逻辑像素)
            let HEART_SCALE = 1;       // 心形缩放因子

            function resizeCanvas() {
                // 获取视口宽高 (逻辑像素)
                W = window.innerWidth;
                H = window.innerHeight;

                // Canvas 物理像素 = 逻辑像素 * DPR
                CW = W * DPR;
                CH = H * DPR;
                canvas.width = CW;
                canvas.height = CH;

                // Canvas CSS 尺寸 = 视口尺寸
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';

                // 中心坐标 (逻辑像素)
                CX = W / 2;
                CY = H / 2;

                // ===== 核心：自适应缩放 =====
                // 心形原始大小范围：x ∈ [-16, 16], y ∈ [-17, 16] 左右
                // 我们希望心形占屏幕宽高的 92%，同时保持比例
                const targetRatio = 0.92; // 占屏幕比例
                // 心形在参数方程中的最大跨度约为 32 (x) 和 33 (y)
                const heartWidth = 32;
                const heartHeight = 33;
                
                // 根据屏幕宽高计算缩放，使得心形刚好占满目标比例
                const scaleX = (W * targetRatio) / heartWidth;
                const scaleY = (H * targetRatio) / heartHeight;
                // 取较小值保证心形完整显示，同时乘以系数让心形更大（因为之前用14，现在直接计算）
                // 但14是经验值，我们直接使用计算出的缩放，并微调让心形更饱满
                const baseScale = Math.min(scaleX, scaleY);
                // 额外放大系数：因为心形不是完全填满边界，适当放大10%
                HEART_SCALE = baseScale * 1.15;
                
                // 存储逻辑尺寸供其他计算
                window.LOGIC_W = W;
                window.LOGIC_H = H;
            }

            resizeCanvas();

            // 窗口变化重置 (防抖)
            let resizeTimer = null;
            window.addEventListener('resize', () => {
                if (resizeTimer) clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    resizeCanvas();
                    // 重新生成心形 (因为坐标基于新尺寸)
                    heart = new Heart();
                    frameCounter = 0;
                    resizeTimer = null;
                }, 100);
            });

            // ----- 颜色配置 -----
            const HEART_COLOR = '#FF69B4';
            const HEART_COLOR_LIGHT = '#FFB6C1';
            const GENERATE_FRAME = 60;

            // ----- 心形函数 (使用逻辑坐标) -----
            function heartFunction(t) {
                const scale = HEART_SCALE;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                return {
                    x: Math.round(x * scale + CX),
                    y: Math.round(y * scale + CY)
                };
            }

            // ----- 随机散射 (内部扩散) -----
            function scatterInside(x, y, beta = 0.15) {
                const ratioX = -beta * Math.log(Math.random());
                const ratioY = -beta * Math.log(Math.random());
                const dx = ratioX * (x - CX);
                const dy = ratioY * (y - CY);
                return { x: Math.round(x - dx), y: Math.round(y - dy) };
            }

            // ----- 呼吸曲线 -----
            function curve(p) {
                return Math.sin(p * 0.25) * 0.5 + 0.5;
            }

            // ----- 位置扰动 (呼吸核心) -----
            function calcPosition(x, y, ratio) {
                const dx = x - CX;
                const dy = y - CY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const force = 1 / Math.pow(dist + 0.1, 0.5);
                const nx = ratio * force * dx * 0.5 + (Math.random() - 0.5) * 1.5;
                const ny = ratio * force * dy * 0.5 + (Math.random() - 0.5) * 1.5;
                return { x: Math.round(x - nx), y: Math.round(y - ny) };
            }

            // ----- 核心类：心形粒子系统 (自适应放大版) -----
            class Heart {
                constructor() {
                    this._points = [];
                    this._edgeDiffusionPoints = [];
                    this._centerDiffusionPoints = [];
                    this.generateFrame = GENERATE_FRAME;
                    this.build(4000);
                }

                build(number) {
                    const pointSet = new Set();
                    let attempts = 0;
                    while (this._points.length < number && attempts < number * 3) {
                        const t = Math.random() * 2 * Math.PI;
                        const p = heartFunction(t);
                        const key = p.x + ',' + p.y;
                        if (!pointSet.has(key)) {
                            pointSet.add(key);
                            this._points.push(p);
                        }
                        attempts++;
                    }

                    // 边缘扩散点
                    for (const p of this._points) {
                        for (let j = 0; j < 3; j++) {
                            const sp = scatterInside(p.x, p.y, 0.05);
                            this._edgeDiffusionPoints.push(sp);
                        }
                    }

                    // 中心扩散点
                    const pointList = [...this._points];
                    for (let i = 0; i < 6000; i++) {
                        const idx = Math.floor(Math.random() * pointList.length);
                        const chosen = pointList[idx];
                        const sp = scatterInside(chosen.x, chosen.y, 0.17);
                        this._centerDiffusionPoints.push(sp);
                    }
                }

                // 计算当前帧所有粒子
                calc(frame) {
                    const frameRatio = frame / 12 * Math.PI;
                    const ratio = 8 * curve(frameRatio);

                    const allPoints = [];

                    // 粒子大小：根据屏幕尺寸动态调整，让粒子在手机上更精致
                    // 使用屏幕宽高的平均值作为参考
                    const avgSize = (W + H) / 2;
                    // 基础粒子大小：0.5~1.5 逻辑像素，根据屏幕大小微调
                    const baseMin = Math.max(0.3, 0.5 * (avgSize / 800));
                    const baseMax = Math.max(0.8, 1.5 * (avgSize / 800));

                    // 主轮廓点
                    for (const p of this._points) {
                        const np = calcPosition(p.x, p.y, ratio);
                        const size = baseMin + Math.random() * (baseMax - baseMin);
                        allPoints.push({ x: np.x, y: np.y, size: size });
                    }

                    // 边缘扩散点
                    for (const p of this._edgeDiffusionPoints) {
                        const np = calcPosition(p.x, p.y, ratio);
                        const size = baseMin * 0.8 + Math.random() * (baseMax * 0.7 - baseMin * 0.8);
                        allPoints.push({ x: np.x, y: np.y, size: size });
                    }

                    // 中心扩散点
                    for (const p of this._centerDiffusionPoints) {
                        const np = calcPosition(p.x, p.y, ratio);
                        const size = baseMin * 1.1 + Math.random() * (baseMax * 1.1 - baseMin * 1.1);
                        allPoints.push({ x: np.x, y: np.y, size: size });
                    }

                    return allPoints;
                }

                render(ctx, frame) {
                    const points = this.calc(frame % this.generateFrame);

                    // 清空
                    ctx.clearRect(0, 0, CW, CH);

                    // ---- 绘制粒子 (圆形) ----
                    for (const p of points) {
                        const color = Math.random() > 0.6 ? HEART_COLOR_LIGHT : HEART_COLOR;
                        ctx.beginPath();
                        const radius = Math.max(0.2, p.size * 0.5);
                        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.globalAlpha = 0.85 + Math.random() * 0.15;
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1.0;

                    // ---- 文字装饰 ----
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // 根据屏幕大小动态调整文字大小
                    const fontSizeBase = Math.min(W, H) / 14;
                    const fontSize = Math.min(fontSizeBase, 45);
                    ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", Arial, sans-serif`;
                    ctx.fillStyle = '#FF69B4';
                    ctx.shadowColor = 'rgba(255,105,180,0.3)';
                    ctx.shadowBlur = 20;
                    ctx.fillText('💗 哥哥，喜欢吗 💗', CX, CY - Math.min(W, H) * 0.38);

                    const subFontSize = Math.min(Math.min(W, H) / 26, 24);
                    ctx.font = `italic ${subFontSize}px Arial, sans-serif`;
                    ctx.fillStyle = '#FFB6C1';
                    ctx.shadowBlur = 12;
                    ctx.fillText('✨ You are my heartbeat ✨', CX, CY - Math.min(W, H) * 0.29);

                    ctx.shadowBlur = 0;
                }
            }

            // ----- 实例化心形 -----
            let heart = new Heart();
            let frameCounter = 0;
            let lastTimestamp = 0;

            // ----- 动画循环 (限制帧率 30fps) -----
            function animate(timestamp) {
                if (timestamp - lastTimestamp < 33) {
                    requestAnimationFrame(animate);
                    return;
                }
                lastTimestamp = timestamp;

                heart.render(ctx, frameCounter);
                frameCounter = (frameCounter + 1) % GENERATE_FRAME;

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            // ----- 键盘快捷键 -----
            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    frameCounter = 0;
                }
                if (e.key === 'f' || e.key === 'F') {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else {
                        document.exitFullscreen().catch(() => {});
                    }
                }
            });

            // 点击/触摸重置呼吸相位
            canvas.addEventListener('click', () => {
                frameCounter = 0;
            });
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                frameCounter = 0;
            }, { passive: false });

            console.log('✨ 自适应放大版 (DPR=' + DPR + ', 尺寸=' + W + 'x' + H + ', 缩放=' + HEART_SCALE.toFixed(2) + ')');
        })();
    </script>
</body>
</html>
