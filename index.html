<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>爱心 · 满屏放大</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: transparent;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');

            // ----- 设备像素比 -----
            const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

            // ----- 尺寸变量 -----
            let W = 0, H = 0;
            let CW = 0, CH = 0;
            let CX = 0, CY = 0;
            let HEART_SCALE = 1;

            function resizeCanvas() {
                W = window.innerWidth;
                H = window.innerHeight;

                CW = W * DPR;
                CH = H * DPR;
                canvas.width = CW;
                canvas.height = CH;

                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';

                CX = W / 2;
                CY = H / 2;

                // ===== 核心：疯狂放大 =====
                // 心形参数方程范围：x: -16~16 (跨度32)，y: -17~16 (跨度33)
                // 目标是让心形占满屏幕的 98%，只留极窄边距
                const targetRatio = 0.98;
                const heartWidth = 32;
                const heartHeight = 33;
                
                // 分别计算宽高缩放
                const scaleX = (W * targetRatio) / heartWidth;
                const scaleY = (H * targetRatio) / heartHeight;
                // 取较小值保证完整显示，再额外放大15%让心形更饱满
                let scale = Math.min(scaleX, scaleY) * 1.2;
                
                // 额外强制放大：如果心形还太小，继续放大
                // 但要注意不要超出边界太多，所以用 clamp
                const maxScale = Math.max(scaleX, scaleY) * 0.95;
                scale = Math.min(scale, maxScale);
                
                HEART_SCALE = scale;
                
                console.log('📱 缩放因子:', HEART_SCALE, '屏幕:', W, 'x', H);
            }

            resizeCanvas();

            let resizeTimer = null;
            window.addEventListener('resize', () => {
                if (resizeTimer) clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    resizeCanvas();
                    heart = new Heart();
                    frameCounter = 0;
                    resizeTimer = null;
                }, 100);
            });

            // ----- 颜色配置 -----
            const HEART_COLOR = '#FF69B4';
            const HEART_COLOR_LIGHT = '#FFB6C1';
            const GENERATE_FRAME = 60;

            // ----- 心形函数 -----
            function heartFunction(t) {
                const scale = HEART_SCALE;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                return {
                    x: Math.round(x * scale + CX),
                    y: Math.round(y * scale + CY)
                };
            }

            function scatterInside(x, y, beta = 0.15) {
                const ratioX = -beta * Math.log(Math.random());
                const ratioY = -beta * Math.log(Math.random());
                const dx = ratioX * (x - CX);
                const dy = ratioY * (y - CY);
                return { x: Math.round(x - dx), y: Math.round(y - dy) };
            }

            function curve(p) {
                return Math.sin(p * 0.25) * 0.5 + 0.5;
            }

            function calcPosition(x, y, ratio) {
                const dx = x - CX;
                const dy = y - CY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const force = 1 / Math.pow(dist + 0.1, 0.5);
                const nx = ratio * force * dx * 0.5 + (Math.random() - 0.5) * 1.5;
                const ny = ratio * force * dy * 0.5 + (Math.random() - 0.5) * 1.5;
                return { x: Math.round(x - nx), y: Math.round(y - ny) };
            }

            // ----- 心形粒子系统 -----
            class Heart {
                constructor() {
                    this._points = [];
                    this._edgeDiffusionPoints = [];
                    this._centerDiffusionPoints = [];
                    this.generateFrame = GENERATE_FRAME;
                    this.build(4000);
                }

                build(number) {
                    const pointSet = new Set();
                    let attempts = 0;
                    while (this._points.length < number && attempts < number * 3) {
                        const t = Math.random() * 2 * Math.PI;
                        const p = heartFunction(t);
                        const key = p.x + ',' + p.y;
                        if (!pointSet.has(key)) {
                            pointSet.add(key);
                            this._points.push(p);
                        }
                        attempts++;
                    }

                    for (const p of this._points) {
                        for (let j = 0; j < 3; j++) {
                            const sp = scatterInside(p.x, p.y, 0.05);
                            this._edgeDiffusionPoints.push(sp);
                        }
                    }

                    const pointList = [...this._points];
                    for (let i = 0; i < 6000; i++) {
                        const idx = Math.floor(Math.random() * pointList.length);
                        const chosen = pointList[idx];
                        const sp = scatterInside(chosen.x, chosen.y, 0.17);
                        this._centerDiffusionPoints.push(sp);
                    }
                }

                calc(frame) {
                    const frameRatio = frame / 12 * Math.PI;
                    const ratio = 8 * curve(frameRatio);

                    const allPoints = [];

                    // 粒子大小：根据屏幕尺寸调整，让粒子精致但不稀疏
                    const avgSize = Math.min(W, H);
                    // 粒子大小范围：0.4~1.8 逻辑像素，随屏幕增大而略微增大
                    const baseMin = Math.max(0.3, 0.5 * (avgSize / 600));
                    const baseMax = Math.max(0.7, 1.8 * (avgSize / 600));

                    for (const p of this._points) {
                        const np = calcPosition(p.x, p.y, ratio);
                        const size = baseMin + Math.random() * (baseMax - baseMin);
                        allPoints.push({ x: np.x, y: np.y, size: size });
                    }

                    for (const p of this._edgeDiffusionPoints) {
                        const np = calcPosition(p.x, p.y, ratio);
                        const size = baseMin * 0.8 + Math.random() * (baseMax * 0.7 - baseMin * 0.8);
                        allPoints.push({ x: np.x, y: np.y, size: size });
                    }

                    for (const p of this._centerDiffusionPoints) {
                        const np = calcPosition(p.x, p.y, ratio);
                        const size = baseMin * 1.1 + Math.random() * (baseMax * 1.1 - baseMin * 1.1);
                        allPoints.push({ x: np.x, y: np.y, size: size });
                    }

                    return allPoints;
                }

                render(ctx, frame) {
                    const points = this.calc(frame % this.generateFrame);

                    ctx.clearRect(0, 0, CW, CH);

                    for (const p of points) {
                        const color = Math.random() > 0.6 ? HEART_COLOR_LIGHT : HEART_COLOR;
                        ctx.beginPath();
                        const radius = Math.max(0.2, p.size * 0.5);
                        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.globalAlpha = 0.85 + Math.random() * 0.15;
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1.0;

                    // ---- 文字 (缩小比例，避免遮挡) ----
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    const fontSize = Math.min(Math.min(W, H) / 18, 38);
                    ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", Arial, sans-serif`;
                    ctx.fillStyle = '#FF69B4';
                    ctx.shadowColor = 'rgba(255,105,180,0.3)';
                    ctx.shadowBlur = 20;
                    ctx.fillText('💗 哥哥，喜欢吗 💗', CX, CY - Math.min(W, H) * 0.35);

                    const subFontSize = Math.min(Math.min(W, H) / 30, 20);
                    ctx.font = `italic ${subFontSize}px Arial, sans-serif`;
                    ctx.fillStyle = '#FFB6C1';
                    ctx.shadowBlur = 12;
                    ctx.fillText('✨ You are my heartbeat ✨', CX, CY - Math.min(W, H) * 0.27);

                    ctx.shadowBlur = 0;
                }
            }

            let heart = new Heart();
            let frameCounter = 0;
            let lastTimestamp = 0;

            function animate(timestamp) {
                if (timestamp - lastTimestamp < 33) {
                    requestAnimationFrame(animate);
                    return;
                }
                lastTimestamp = timestamp;

                heart.render(ctx, frameCounter);
                frameCounter = (frameCounter + 1) % GENERATE_FRAME;

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') frameCounter = 0;
                if (e.key === 'f' || e.key === 'F') {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else {
                        document.exitFullscreen().catch(() => {});
                    }
                }
            });

            canvas.addEventListener('click', () => { frameCounter = 0; });
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                frameCounter = 0;
            }, { passive: false });

            console.log('✨ 满屏放大版 (缩放=' + HEART_SCALE.toFixed(2) + ')');
        })();
    </script>
</body>
</html>
